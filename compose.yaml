name: ai3-leo

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_NAME: db_sistema_web
      DB_USER: ai3
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - ./public:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: db_sistema_web
      MARIADB_USER: ai3
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env}
    volumes:
      - datos_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_mariadb:
